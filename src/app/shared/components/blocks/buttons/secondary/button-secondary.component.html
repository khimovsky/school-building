<button class="btn" [disabled]="disabled" [attr.title]="tooltip" [class.icon-only]="iconOnly" [class.active]="active"
  [class.btn-small]="size === 'small'" [class.btn-medium]="size === 'medium'" [class.btn-big]="size === 'big'"
>
  @if (iconName && iconPosition === 'left') {
    <app-icon class="btn-icon" [name]="iconName" [color]="iconColor"></app-icon>
  }
  <span class="btn-text"><ng-content /></span>
  @if (iconName && iconPosition === 'right') {
    <app-icon class="btn-icon" [name]="iconName" [color]="iconColor"></app-icon>
  }
</button>
